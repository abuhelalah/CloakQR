name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.1
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
      - name: Install Ninja and NSIS
        run: choco install ninja nsis -y
      - name: Configure and build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_CLOAKQR_APP=ON
          cmake --build build-release --parallel
      - name: Test and package
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build-release --output-on-failure
          cpack --config build-release/CPackConfig.cmake -G NSIS -B build-release/packages
      - name: Smoke test installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem "build-release/packages/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer .exe not found in build-release/packages" }

          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait

          $installRoot = Join-Path $env:ProgramFiles "CloakQR"
          $appExe = Join-Path $installRoot "bin\cloakqr.exe"
          if (-not (Test-Path $appExe)) { throw "Installed GUI executable missing: $appExe" }

          $shortcutCandidates = @(
            (Join-Path ([Environment]::GetFolderPath("Desktop")) "CloakQR.lnk"),
            (Join-Path ([Environment]::GetFolderPath("CommonDesktopDirectory")) "CloakQR.lnk"),
            (Join-Path ([Environment]::GetFolderPath("Programs")) "CloakQR\CloakQR.lnk"),
            (Join-Path ([Environment]::GetFolderPath("CommonPrograms")) "CloakQR\CloakQR.lnk")
          )
          if (-not ($shortcutCandidates | Where-Object { Test-Path $_ })) {
            throw "Expected desktop/start-menu shortcut was not created"
          }

          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
            throw "Installed app exited early with code $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force

          $uninstaller = Join-Path $installRoot "Uninstall.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          }
      - uses: actions/upload-artifact@v5
        with:
          name: windows-release
          path: build-release/packages/*.exe
          if-no-files-found: error