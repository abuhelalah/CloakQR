name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.1
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
      - name: Install Ninja and NSIS
        run: choco install ninja nsis -y
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure and build
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_CLOAKQR_APP=ON
          cmake --build build-release --parallel
      - name: Test and package
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build-release --output-on-failure
          cpack --config build-release/CPackConfig.cmake -G NSIS -B build-release/packages
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build-release/packages/*.exe