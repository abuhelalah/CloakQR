name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.1
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
      - name: Install Ninja and NSIS
        run: choco install ninja nsis -y
      - name: Configure and build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_CLOAKQR_APP=ON
          cmake --build build-release --parallel
      - name: Test and package
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build-release --output-on-failure
          cpack --config build-release/CPackConfig.cmake -G NSIS -B build-release/packages
      - uses: actions/upload-artifact@v5
        with:
          name: windows-release
          path: build-release/packages/*.exe