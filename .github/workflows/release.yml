name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libfuse2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.1
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtdeclarative qttools qttranslations qtmultimedia
      - name: Configure
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_CLOAKQR_APP=ON
      - name: Build and test
        run: |
          cmake --build build-release --parallel
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ctest --test-dir build-release --output-on-failure
      - name: Build AppImage and archive
        run: |
          QMAKE="$QT_ROOT_DIR/bin/qmake" scripts/package_appimage.sh
          cpack --config build-release/CPackConfig.cmake -G TGZ -B build-release/packages
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            build-release/*.AppImage
            build-release/packages/*.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.1
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtdeclarative qttools qttranslations qtmultimedia
      - name: Install Ninja and NSIS
        run: choco install ninja nsis -y
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure and build
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_CLOAKQR_APP=ON
          cmake --build build-release --parallel
      - name: Test and package
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build-release --output-on-failure
          cpack --config build-release/CPackConfig.cmake -G NSIS -B build-release/packages
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build-release/packages/*.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.1
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtdeclarative qttools qttranslations qtmultimedia
      - name: Restore signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cloakqr.keystore"
      - name: Configure
        env:
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          args=(
            -S . -B build-android -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_CLOAKQR_APP=ON
            -DANDROID_ABI=arm64-v8a
          )
          if [[ -f "$RUNNER_TEMP/cloakqr.keystore" ]]; then
            args+=(
              -DQT_ANDROID_SIGN_APK=ON
              -DQT_ANDROID_SIGN_AAB=ON
              -DQT_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/cloakqr.keystore"
              -DQT_ANDROID_KEYSTORE_ALIAS="$KEYSTORE_ALIAS"
              -DQT_ANDROID_KEYSTORE_STORE_PASS="$KEYSTORE_PASSWORD"
              -DQT_ANDROID_KEYSTORE_KEY_PASS="$KEYSTORE_PASSWORD"
            )
          fi
          cmake "${args[@]}"
      - name: Build APK and AAB
        run: |
          cmake --build build-android --parallel --target CloakQR_make_apk
          cmake --build build-android --parallel --target CloakQR_make_aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build-android/android-build/build/outputs/apk/**/*.apk
            build-android/android-build/build/outputs/bundle/**/*.aab

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*